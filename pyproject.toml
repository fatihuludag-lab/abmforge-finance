[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abmforge-finance"
version = "0.1.0a0"
description = "A research-grade financial market simulation extension for ABMForge."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Fatih Uludağ", email = "fatihuludag@yyu.edu.tr" }
]
keywords = [
  "agent-based modeling",
  "financial markets",
  "market microstructure",
  "limit order book",
  "reinforcement learning",
  "simulation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering",
  "Typing :: Typed",
]
dependencies = [
  "abmforge>=0.3.0a1,<0.4",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "hypothesis>=6.100",
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.6",
  "twine>=5",
]

[project.urls]
Homepage = "https://github.com/fatihuludag-lab/abmforge-finance"
Repository = "https://github.com/fatihuludag-lab/abmforge-finance"
Issues = "https://github.com/fatihuludag-lab/abmforge-finance/issues"
ABMForge = "https://github.com/fatihuludag-lab/abmforge"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
abmforge_finance = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-ra",
  "--strict-config",
  "--strict-markers",
]

[tool.coverage.run]
branch = true
source = ["abmforge_finance"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 95

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
files = ["src", "tests"]
